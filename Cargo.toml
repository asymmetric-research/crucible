[workspace]
members = [
    "crates/crucible-fuzzer",
    "crates/crucible-test-context",
    "crates/crucible-fuzz-macro",
    "crates/crucible-fuzz-runtime",
    "crates/crucible-invariant-macro",
    "crates/crucible-macro-utils",
    "crates/crucible-idl-gen",
    "crates/crucible-fuzz-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
litesvm = { version = "0.9.0", features = ["register-tracing"] }
anchor-lang = "1.0.1"
anchor-spl = { version = "1.0.1", features = ["token_2022"] }
# Solana crates pinned to match anchor master and litesvm 0.9.0
solana-pubkey = { version = "3.0", features = ["curve25519"] }
solana-keypair = "3.0"
solana-signer = "3.0"
solana-signature = "3.0"
solana-account = "3.0"
solana-transaction = "3.0"
solana-message = "3.0"
solana-hash = "3.0"
solana-program-runtime = "3.0"
solana-transaction-context = "3.0"
solana-transaction-error = "3.0"
solana-clock = "3.0"
solana-sbpf = "0.13"
solana-compute-budget = "3.0"
solana-bpf-loader-program = "3.0"
solana-rpc-client = "3.0"
solana-rpc-client-api = "3.0"

spl-token = "9.0"
bytemuck = { version = "1.14", features = ["derive"] }
once_cell = "1.19"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
clippy.wildcard_imports = "deny"
