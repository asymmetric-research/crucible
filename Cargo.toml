[workspace]
members = [
    "crates/crucible-fuzzer",
    "crates/crucible-test-context",
    "crates/crucible-fuzz-macro",
    "crates/crucible-fuzz-runtime",
    "crates/crucible-invariant-macro",
    "crates/crucible-macro-utils",
    "crates/crucible-idl-gen",
    "crates/crucible-fuzz-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
litesvm = { version = "=0.15.2", features = ["persistence-internal", "register-tracing"] }
anchor-lang = "1.0.1"
anchor-spl = { version = "1.0.1", features = ["token_2022"] }
# LiteSVM 0.15 uses Agave's 4.1 runtime while the compatible client facade
# crates remain on their independently versioned 3.x/4.x release lines.
agave-feature-set = "4.1.1"
solana-pubkey = { version = "3.0", features = ["curve25519"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-signature = "3.4.1"
solana-account = "4.3.0"
solana-transaction = "4.1.5"
solana-message = "4.2.4"
solana-program-runtime = "4.1.1"
solana-transaction-context = "4.1.1"
solana-transaction-error = "3.3.1"
solana-sbpf = "0.21.0"
solana-compute-budget = "4.1.1"
solana-instruction = "3.4.0"
solana-sysvar = { version = "4.1.0", features = ["wincode"] }
solana-sysvar-id = "3.1.0"
solana-rpc-client = "4.1.1"
solana-rpc-client-api = "4.1.1"
wincode = "0.5.5"

spl-token = "9.0"
bytemuck = { version = "1.14", features = ["derive"] }
once_cell = "1.19"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
clippy.wildcard_imports = "deny"
