[workspace]
members = [
    "crates/crucible-fuzzer",
    "crates/crucible-test-context",
    "crates/crucible-fuzz-macro",
    "crates/crucible-invariant-macro",
    "crates/crucible-macro-utils",
    "crates/crucible-idl-gen",
    "crates/crucible-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
litesvm = { version = "0.9.0", features = ["register-tracing"] }
# Anchor framework - fork with solana-sysvar ~3.1 fix
# crates.io anchor-lang 1.0.0-rc.2 uses solana-sysvar ~3.0 which conflicts with litesvm's ~3.1
anchor-lang = { git = "https://github.com/asymmetric-research/anchor-fuzzing", branch = "feature/fuzzing" }
anchor-spl = { git = "https://github.com/asymmetric-research/anchor-fuzzing", branch = "feature/fuzzing", features = ["token_2022"] }
# Solana crates pinned to match anchor master and litesvm 0.9.0
solana-pubkey = "3.0"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-signature = "3.0"
solana-account = "3.0"
solana-transaction = "3.0"
solana-message = "3.0"
solana-hash = "3.0"
solana-program-runtime = "3.0"
solana-transaction-context = "3.0"
solana-transaction-error = "3.0"
solana-clock = "3.0"
solana-sbpf = "0.13"

spl-token = "9.0"
bytemuck = { version = "1.14", features = ["derive"] }
once_cell = "1.19"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
clippy.wildcard_imports = "deny"
