name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --all-features --locked

  standalone-harnesses:
    name: Standalone harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path crates/crucible-fuzzer/test-program/fuzz/test-program-fuzz/Cargo.toml --all-targets --all-features --locked
      - run: cargo check --manifest-path examples/escrow/fuzz/escrow/Cargo.toml --all-targets --all-features --locked
      # Each staking feature expands to its own binary entrypoint and allocator,
      # so the supported targets must be checked independently.
      - run: cargo check --manifest-path examples/staking/fuzz/staking/Cargo.toml --all-targets --no-default-features --features fuzz_single_stake --locked
      - run: cargo check --manifest-path examples/staking/fuzz/staking/Cargo.toml --all-targets --no-default-features --features invariant_fuzz --locked
      - run: cargo check --manifest-path examples/staking/fuzz/staking/Cargo.toml --all-targets --no-default-features --features invariant_fuzz_batched --locked
      # This harness intentionally keeps its generated lockfile untracked.
      - run: cargo check --manifest-path examples/owner-mutation-airdrop/fuzz/owner-mutation-airdrop/Cargo.toml --all-targets --all-features
