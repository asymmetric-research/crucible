[package]
name = "counter_fuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
litesvm = { git = "https://github.com/asymmetric-research/litesvm-tracing", branch = "v0.7.1-with-tracing" }
anchor-test = { path = "../../../../anchor-test" }
anchor-test-context = { path = "../../../../anchor-test/anchor-test-context" }
anchor-lang = { path = "../../../../../lang" }
arbitrary = { version = "1", features = ["derive"] }
libafl = { version = "0.13", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.13", features = ["std"] }
anchor_counter = { path = "../../programs/anchor-counter", features = ["no-entrypoint"] }
solana-sdk = "2.3"
solana-message = "2.3"

[features]
fuzz_single = []
invariant_increment = []
