[package]
name = "anchor_counter_fuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
litesvm = {workspace=true}
solana-program = "2.3"
solana-sdk = "2.3"
anchor-test = { workspace = true}
anchor-test-context = {workspace = true}
anchor-lang = { workspace= true}
arbitrary = { version = "1", features = ["derive"] }
once_cell = "1"
libafl = {workspace=true}
libafl_bolts = {workspace=true}
solana-message = "2.3"


anchor_counter = { path = "../../programs/anchor-counter", features = ["no-entrypoint"] }

[[bin]]
name = "fuzz"
path = "src/main.rs"

[features]
fuzz_increment = []
invariant_increment = []
