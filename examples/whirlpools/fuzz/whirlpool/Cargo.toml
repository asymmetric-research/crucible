[package]
name = "whirlpool_fuzz"
version = "0.1.0"
edition = "2021"

[workspace]
# Standalone workspace - isolated from parent project to avoid Solana version conflicts

[dependencies]
# Fuzzing framework
crucible-fuzzer = { path = "/opt/crucible/crates/crucible-fuzzer" }
crucible-test-context = { path = "/opt/crucible/crates/crucible-test-context" }
crucible-idl-gen = { path = "/opt/crucible/crates/crucible-idl-gen" }
anchor-lang = { git = "https://github.com/asymmetric-research/anchor-fuzzing", branch = "feature/fuzzing" }

# Solana v3.x (required for litesvm 0.9.0)
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-program = "3.0"
solana-message = "3.0"
solana-signature = "3.1"
solana-instruction = "3.1"

# Fuzzing
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
arbitrary = { version = "1", features = ["derive"] }

# LiteSVM + ctor (required for workspace-isolated harness)
litesvm = { version = "0.9.0", features = ["register-tracing"] }
ctor = "0.6"

# Utilities
anyhow = "1.0"
bytemuck = "1.14"
ctrlc = "3.4"
spl-token = "9.0"
spl-associated-token-account = "7.0"

[features]
fuzz_single = []
invariant_test = []
