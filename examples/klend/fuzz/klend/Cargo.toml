[package]
name = "klend_fuzz"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
crucible-fuzzer = { path = "../../../../crates/crucible-fuzzer" }
crucible-test-context = { path = "../../../../crates/crucible-test-context", features = ["rpc-clone"] }
crucible-idl-gen = { path = "../../../../crates/crucible-idl-gen" }
anchor-lang = { git = "https://github.com/asymmetric-research/anchor-fuzzing", branch = "feature/fuzzing" }
arbitrary = { version = "1", features = ["derive"] }
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
solana-message = "3.0"
solana-program = "3.0"
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-signature = "3.1"
solana-instruction = "3.1"
solana-rpc-client-api = "3.0"
solana-account = "3.0"
anyhow = "1.0"
bytemuck = "1.14"
borsh = "1.5"
ctrlc = "3.4"
ctor = "0.6"
litesvm = { version = "0.9.0", features = ["register-tracing"] }

[[bin]]
name = "invariant_test"
path = "src/main.rs"

[features]
fuzz_single = []
invariant_test = []
