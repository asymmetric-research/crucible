[package]
name = "klend_fuzz"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anchor-test = { path = "../../../../anchor-test" }
anchor-test-context = { path = "../../../../anchor-test/anchor-test-context" }
anchor-lang = { path = "../../../../../lang" }
anchor-fuzz-gen = { path = "../../../../anchor-test/anchor-fuzz-gen" }
arbitrary = { version = "1", features = ["derive"] }
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
solana-message = "3.0"
solana-program = "3.0"
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-signature = "3.1"
solana-instruction = "3.1"
anyhow = "1.0"
bytemuck = "1.14"
borsh = "1.5"
ctrlc = "3.4"

[features]
fuzz_single = []
invariant_test = []
