[package]
name = "staking_fuzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[workspace]
# Standalone workspace - isolated from parent to avoid Solana version conflicts

[dependencies]
crucible-fuzzer = { path = "../../../../crates/crucible-fuzzer" }
crucible-test-context = { path = "../../../../crates/crucible-test-context" }
anchor-lang = "1.0.1"
arbitrary = { version = "1", features = ["derive"] }
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
solana-keypair = "3.0"
solana-pubkey = "3.0"
solana-signer = "3.0"

staking = { path = "../../programs/staking", features = ["no-entrypoint"] }
ctrlc = "3.4"
serde_json = "1.0"

[[bin]]
name = "invariant_test"
path = "src/main.rs"

[features]
invariant_fuzz = []
fuzz_single_stake = []
invariant_fuzz_batched = []
