[package]
name = "marginfi"
version = "0.1.4"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marginfi"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["mainnet-beta"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test-bpf = ["test", "debug"]
test = []
client = []
devnet = []
mainnet-beta = []
debug = []
staging = []

[dependencies]
spl-transfer-hook-interface = "0.9.0"

anchor-lang = ">=0.31"
anchor-spl = { version = ">=0.31", features = ["token_2022"] }

pyth-solana-receiver-sdk = { version = "1.1.0", default-features = false }
switchboard-on-demand = { version = "0.11.3", default-features = false, features = ["solana-v3"] }
solana-stake-interface = "*"

borsh = "1.5.7"
bytemuck = "1.22.0"
fixed = "=1.28.0"
fixed-macro = "1.2.0"
lazy_static = "1.4.0"
type-layout = "0.2.0"
static_assertions = "1.1.0"
cfg-if = "1.0.0"
enum_dispatch = "0.3.13"
solana-security-txt = "1.1.1"
solana-sdk="*"
anyhow = "1.0"

[dev-dependencies]
pretty_assertions = "1"
anyhow = "1"

