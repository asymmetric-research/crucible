[package]
name = "marginfi-v2-fuzz_fuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
anchor-test = { path = "../../../../anchor-test" }
anchor-test-context = { path = "../../../../anchor-test/anchor-test-context" }
arbitrary = { version = "1", features = ["derive"] }
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
solana-message = "3.0"
solana-program = "3.0"
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-signature = "3.1"
solana-instruction = "3.1"

marginfi_program = { path = "../../programs/marginfi", package = "marginfi", features = ["no-entrypoint"] }
# anchor-lang and anchor-spl are re-exported from anchor-test 

# pyth-solana-receiver-sdk removed - types redefined locally in main.rs
anyhow = "1.0"
fixed = "1.28"
fixed-macro = "1.2"
bytemuck = "1.14"
borsh = "1.5"
litesvm = { version = "0.9.0", features = ["register-tracing"] }


[features]
fuzz_single = []
clone_cost = []
invariant_test = []
