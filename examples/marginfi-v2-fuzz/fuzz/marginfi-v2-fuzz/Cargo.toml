[package]
name = "marginfi-v2-fuzz_fuzz"
version = "0.1.0"
edition = "2021"

[workspace]
# Standalone workspace - isolated from parent project to avoid Solana version conflicts

[dependencies]
crucible-fuzzer = { path = "../../../../crates/crucible-fuzzer" }
crucible-test-context = { path = "../../../../crates/crucible-test-context" }
arbitrary = { version = "1", features = ["derive"] }
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
solana-message = "3.0"
solana-program = "3.0"
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-signature = "3.1"
solana-instruction = "3.1"

# anchor-lang is needed for prelude and serialization traits
anchor-lang = { git = "https://github.com/asymmetric-research/anchor-fuzzing", branch = "feature/fuzzing" }
# crucible-idl-gen generates complete types from IDL (including state types)
crucible-idl-gen = { path = "../../../../crates/crucible-idl-gen" } 

# pyth-solana-receiver-sdk removed - types redefined locally in main.rs
anyhow = "1.0"
fixed = "1.28"
fixed-macro = "1.2"
bytemuck = "1.14"
borsh = "1.5"
litesvm = { version = "0.9.0", features = ["register-tracing"] }
ctrlc = "3.4"
serde_json = "1.0"

[features]
fuzz_single = []
invariant_test = []
__all_tests = []
