[package]
name = "test-program"
version = "0.1.0"
edition = "2021"

[workspace]
# Standalone package - not part of parent workspace to avoid Solana version conflicts

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { git = "https://github.com/asymmetric-research/anchor-fuzzing", branch = "feature/fuzzing" }
solana-pubkey = "3.0"
