[package]
name = "crucible-test-context"
version = "0.3.0-alpha.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "LiteSVM-backed test context used by crucible-fuzzer"

[features]
default = []
rpc-clone = ["dep:solana-rpc-client", "dep:solana-rpc-client-api"]

[dependencies]
litesvm.workspace = true
anchor-lang.workspace = true
anyhow.workspace = true
borsh = "1.5"

# Client facades and LiteSVM's Agave runtime types.
agave-feature-set.workspace = true
solana-pubkey.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-signature.workspace = true
solana-account.workspace = true
solana-transaction.workspace = true
solana-message.workspace = true
solana-program-runtime.workspace = true
solana-transaction-context.workspace = true
solana-transaction-error.workspace = true
solana-sbpf.workspace = true
solana-compute-budget.workspace = true
solana-instruction.workspace = true
solana-sysvar.workspace = true
solana-sysvar-id.workspace = true
wincode.workspace = true

spl-token.workspace = true
bytemuck.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell.workspace = true
rustc-hash = "2.0"
addr2line = "0.24"
gimli = { version = "0.31", default-features = false, features = ["read"] }
object = { version = "0.36", default-features = false, features = ["read"] }
rustc-demangle = "0.1"
solana-rpc-client = { workspace = true, optional = true }
solana-rpc-client-api = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"
object = { version = "0.36", features = ["read", "write"] }
