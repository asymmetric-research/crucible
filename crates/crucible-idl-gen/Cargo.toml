[package]
name = "crucible-idl-gen"
version = "0.2.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Generate Rust types from Anchor IDL for fuzzing"

[lib]
proc-macro = true

[dependencies]
# Proc macro essentials
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }

# IDL parsing - reuse Anchor's IDL types
anchor-lang-idl = { version = "0.1.2", features = ["convert"] }

# Base58 decoding for program ID
bs58 = "0.5"

# Codama IDL support
codama-nodes = "0.7"

# JSON/serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Case conversion
heck = "0.5"

# Error handling
anyhow = "1.0"

[dev-dependencies]
# For the native-instruction bincode encoding round-trip tests
bincode = "1.3"
