[package]
name = "anchor-test"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "anchor-test-context", 
    "anchor-fuzz-macro",
    "anchor-invariant-macro", 
    "anchor-macro-utils",
]
resolver = "2"


[workspace.dependencies]
anyhow = "1.0"
litesvm = { version = "0.9.0", features = ["register-tracing"] }
# Using local anchor with Solana v3.1 support
anchor-lang = { path = "../../lang" }
anchor-spl = { path = "../../spl" }
# Solana crates pinned to match anchor master and litesvm 0.9.0
solana-pubkey = "3.0"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-signature = "3.0"
solana-account = "3.0"
solana-transaction = "3.0"
solana-message = "3.0"
solana-hash = "3.0"
solana-program-runtime = "3.0"
solana-transaction-context = "3.0"
solana-clock = "3.0"
solana-sbpf = "0.13"

spl-token = "9.0"

[dependencies]
rand = "0.8"
anyhow = { workspace = true }
anchor-test-context = { path = "./anchor-test-context" }
anchor-fuzz-macro = { path = "./anchor-fuzz-macro" }
anchor-invariant-macro = { path = "./anchor-invariant-macro" }
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.unused_import_braces = "allow"
clippy.wildcard_imports = "deny"

[features]
no-entrypoint = []


