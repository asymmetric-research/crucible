[package]
name = "anchor-test"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "anchor-test-context", 
    "anchor-fuzz-macro",
    "anchor-invariant-macro",
]
resolver = "2"

# Add workspace-level package metadata for inheritance
[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LiteSVM/litesvm"
rust-version = "1.75.0"

[workspace.dependencies]
anyhow = "1.0"
litesvm = { path = "litesvm", version = "0.6" }
ansi_term = "0.12"
bincode = "1.3"
criterion = "0.5"
ed25519-dalek = "1.0.1"
indexmap = "2.6"
itertools = "0.14"
libsecp256k1 = "0.6.0"
log = "0.4"
napi = { version = "2.12.2", default-features = false }
qualifier_attr = "0.2.2"
serde = "1.0"
smallvec = "1.13"
solana-account = "2.2"
solana-address-lookup-table-interface = "2.2"
solana-bpf-loader-program = "2.2"
solana-builtins = "2.2"
solana-clock = "2.2"
solana-compute-budget = "2.2"
solana-compute-budget-instruction = "2.2"
solana-compute-budget-interface = "2.2"
solana-config-program = "2.2"
solana-ed25519-program = "2.2"
solana-epoch-rewards = "2.2"
solana-epoch-schedule = "2.2"
solana-feature-set = "2.2"
solana-fee = "2.2"
solana-fee-structure = "2.2"
solana-hash = "2.2"
solana-instruction = "2.2"
solana-instructions-sysvar = "2.2"
solana-keypair = "2.2"
solana-last-restart-slot = "2.2"
solana-loader-v3-interface = "3.0"
solana-loader-v4-interface = "2.2"
solana-loader-v4-program = "2.2"
solana-log-collector = "2.2"
solana-measure = "2.2"
solana-message = "2.2"
solana-native-token = "2.2"
solana-nonce = "2.2"
solana-nonce-account = "2.2"
solana-precompiles = "2.2"
solana-program = "2.2"
solana-program-error = "2.2"
solana-program-option = "2.2"
solana-program-pack = "2.2"
solana-program-runtime = "2.2"
solana-program-test = "2.2"
solana-pubkey = "2.2"
solana-rent = "2.2"
solana-reserved-account-keys = "2.2"
solana-runtime-transaction = "2.2"
solana-sdk-ids = "2.2"
solana-secp256k1-program = "2.2"
solana-sha256-hasher = "2.2"
solana-signature = "2.2"
solana-signer = "2.2"
solana-slot-hashes = "2.2"
solana-slot-history = "2.2"
solana-stake-interface = "1.2.1"
solana-svm = "2.2"
solana-svm-transaction = "2.2"
solana-system-interface = "1"
solana-system-program = "2.2"
solana-sysvar = "2.2"
solana-sysvar-id = "2.2"
solana-timings = "2.2"
solana-transaction = "2.2"
solana-transaction-context = "2.2"
solana-transaction-error = "2.2"
solana-vote-program = "2.2"
spl-associated-token-account-client = "2.0"
spl-token = "7.0.0"
spl-token-2022 = "7.0.0"
test-log = "0.2"
thiserror = "2.0"
tokio = "1.35"

[dependencies]
rand = "0.8"
anyhow = { workspace = true }
anchor-test-context = { path = "./anchor-test-context" }
anchor-fuzz-macro = { path = "./anchor-fuzz-macro" }
anchor-invariant-macro = { path = "./anchor-invariant-macro" }

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.unused_import_braces = "allow"
clippy.wildcard_imports = "deny"

[features]
no-entrypoint = []

